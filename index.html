<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>短剧互动入口</title>
    <link rel="stylesheet" href="./styles.css?v=27" />
  </head>
  <body>
    <main class="app-shell">
      <section id="intakePanel" class="intake-panel">
        <div class="intake-shell">
          <div class="intake-copy">
            <span class="intake-kicker">STORY LINK</span>
            <h1>贴入短剧链接</h1>
            <p>看完之后，随时入戏。</p>
          </div>
          <form id="sourceForm" class="source-form">
            <label class="source-label" for="sourceInput">短剧链接</label>
            <textarea
              id="sourceInput"
              class="source-input"
              rows="4"
              placeholder="粘贴短剧链接"
            ></textarea>
            <button id="sourceSubmit" type="button" class="source-submit">进入剧情</button>
          </form>
        </div>
      </section>

      <section id="videoPanel" class="video-panel">
        <div
          id="storyPlayer"
          class="story-player"
          aria-label="短剧播放器，播放结束后可上滑进入互动剧情"
        >
          <video
            id="dramaVideo"
            class="drama-video"
            src="./assets/drama-demo-web.mp4"
            playsinline
            controls
            preload="metadata"
          ></video>
          <div class="source-card" aria-live="polite">
            <span id="sourceKicker" class="source-kicker"></span>
            <strong id="sourceTitle"></strong>
            <p id="sourceMeta"></p>
          </div>
          <button id="swipeGate" class="swipe-gate" type="button" hidden>
            <span>上滑入戏</span>
          </button>
        </div>
      </section>

      <section id="loadingPanel" class="loading-panel" hidden>
        <div class="loader"></div>
        <p id="loadingText"></p>
        <p id="loadingMeta" class="loading-meta"></p>
      </section>

      <section id="gamePanel" class="galgame-panel" hidden>
        <div class="top-hud">
          <div>
            <span id="nodeIndex">Chapter 1</span>
            <strong id="sceneTitle">宴席逼问</strong>
          </div>
          <div class="stat-pills" aria-label="角色状态">
            <span id="statPrestige">威望 12</span>
            <span id="statClue">线索 20</span>
            <span id="statAlert">危险 10</span>
          </div>
        </div>

        <article id="novelPage" class="novel-page" hidden></article>

        <div id="characterStage" class="character-stage" hidden aria-hidden="true">
          <img id="leftSprite" class="character-sprite sprite-left" alt="" />
          <img id="rightSprite" class="character-sprite sprite-right" alt="" />
        </div>

        <div id="toolRow" class="tool-row" aria-label="随身道具"></div>

        <section class="dialogue-area" aria-live="polite">
          <div class="speaker-tag" id="speakerName">当前处境</div>
          <p id="storyText">海风压低宴席，你已经没有退路。</p>
          <p id="resultNote" class="result-note" hidden></p>
          <button id="dialogueNext" class="dialogue-next" type="button" hidden>继续</button>
        </section>

        <form id="customForm" class="custom-form" hidden>
          <input id="customInput" type="text" placeholder="写下你的自由行动" />
          <button type="submit">执行</button>
        </form>

        <div id="choiceGrid" class="choice-grid" aria-label="剧情选项"></div>

        <div id="advanceBar" class="advance-bar" hidden>
          <span></span>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./app.js?v=28"></script>
  </body>
</html>
