<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>短剧关卡跑团 MVP</title>
    <link rel="stylesheet" href="./styles.css?v=12" />
  </head>
  <body>
    <main class="chat-shell">
      <section id="videoPanel" class="video-panel">
        <div id="storyPlayer" class="story-player" aria-label="短剧播放器，播完后上滑进入跑团模式">
          <video id="dramaVideo" class="drama-video" src="./assets/drama-demo-web.mp4" playsinline controls preload="metadata"></video>
          <button id="swipeGate" class="swipe-gate" type="button" hidden>
            <span>上滑进入跑团模式</span>
          </button>
        </div>
      </section>

      <section id="loadingPanel" class="loading-panel" hidden>
        <div class="loader"></div>
        <p id="loadingText">正在接入跑团...</p>
      </section>

      <section id="gamePanel" class="chat-panel" hidden>
        <header class="chat-header">
          <div>
            <span id="sceneIndex">Level 1</span>
            <h2 id="sceneTitle">宴席逼问</h2>
          </div>
          <p id="sceneMood">压迫 / 海上生存</p>
        </header>

        <section class="growth-panel" aria-label="角色成长">
          <article class="growth-card">
            <span>威望</span>
            <strong id="statPrestige">12</strong>
            <i><b id="barPrestige"></b></i>
          </article>
          <article class="growth-card">
            <span>生存</span>
            <strong id="statSurvival">18</strong>
            <i><b id="barSurvival"></b></i>
          </article>
          <article class="growth-card">
            <span>线索</span>
            <strong id="statClue">20</strong>
            <i><b id="barClue"></b></i>
          </article>
          <article class="growth-card">
            <span>人脉</span>
            <strong id="statAllies">8</strong>
            <i><b id="barAllies"></b></i>
          </article>
          <article class="growth-card is-danger">
            <span>大伯警觉</span>
            <strong id="statAlert">10</strong>
            <i><b id="barAlert"></b></i>
          </article>
        </section>

        <section id="messageList" class="message-list" aria-live="polite"></section>

        <section id="inventoryPanel" class="inventory-panel" hidden>
          <div class="status-card" aria-label="玩家状态">
            <div class="panel-title">
              <span>状态</span>
              <strong id="statusName">你</strong>
            </div>
            <dl class="status-list">
              <div>
                <dt>身份</dt>
                <dd id="statusRole">被大伯逼问的年轻船民</dd>
              </div>
              <div>
                <dt>体力</dt>
                <dd><span id="statusHp">72</span>/100</dd>
              </div>
              <div>
                <dt>信任</dt>
                <dd><span id="statusTrust">18</span>/100</dd>
              </div>
              <div>
                <dt>线索</dt>
                <dd id="statusClue">旧书海图</dd>
              </div>
            </dl>
          </div>
          <div class="equipment-card-list">
            <div class="panel-title">
              <span>装备</span>
              <strong>勾选后随行动携带</strong>
            </div>
            <div id="equipmentList" class="equipment-list"></div>
          </div>
        </section>

        <form id="playForm" class="composer">
          <button id="toggleInventoryButton" class="soft-button" type="button" aria-expanded="false">状态</button>
          <input id="playerInput" type="text" placeholder="输入你的行动或台词" />
          <button type="submit">发送</button>
          <button id="nextLineButton" type="button">下一关</button>
        </form>

        <div class="quick-row" aria-label="快捷行动">
          <button type="button" data-choice="我当众逼大伯承认当年赚了钱对半分的约定。">逼他认账</button>
          <button type="button" data-choice="我拿出旧书海图，反问他为什么害怕这片海。">亮出海图</button>
          <button type="button" data-choice="我先忍住，观察宴席上谁站在大伯那边。">观察站队</button>
          <button type="button" data-choice="我直接摔杯离席，回去查旧木箱里的坐标。">摔杯离席</button>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./app.js?v=12"></script>
  </body>
</html>
