<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>短剧对话跑团 MVP</title>
    <link rel="stylesheet" href="./styles.css?v=9" />
  </head>
  <body>
    <main class="chat-shell">
      <section id="videoPanel" class="video-panel">
        <div id="storyPlayer" class="story-player" aria-label="短剧播放器">
          <div class="video-topbar">
            <span>短剧样片</span>
            <strong>02:19</strong>
          </div>
          <div class="faux-frame">
            <div class="faux-book"></div>
            <div class="faux-hero"></div>
            <div class="faux-banquet"></div>
          </div>
          <div class="video-copy">
            <p class="eyebrow">Drama Gate</p>
            <h1>看完这一幕，接管主角命运</h1>
            <p id="videoCaption">破旧木箱被打开，旧书上标着未知海域和坐标。</p>
          </div>
          <div class="video-progress"><span id="videoProgress"></span></div>
          <button id="replayVideoButton" class="replay-button" type="button">重播</button>
          <button id="swipeGate" class="swipe-gate" type="button" hidden>
            <span>上滑进入跑团模式</span>
            <strong>解锁付费通道</strong>
          </button>
        </div>
      </section>

      <section id="payPanel" class="pay-panel" hidden>
        <div class="pay-card">
          <p class="eyebrow">Paid Channel</p>
          <h2>解锁：从视频结尾入戏</h2>
          <p>演示版会模拟支付成功，然后把刚才的短剧剧情转换成跑团 sourceNovel。</p>
          <button id="payButton" type="button">模拟支付并进入</button>
          <button id="backToVideoButton" type="button">返回短剧</button>
        </div>
      </section>

      <section id="loadingPanel" class="loading-panel" hidden>
        <div class="loader"></div>
        <p id="loadingText">正在把短剧拆成对话...</p>
      </section>

      <section id="gamePanel" class="chat-panel" hidden>
        <header class="chat-header">
          <div>
            <span id="sceneIndex">Scene 1</span>
            <h2 id="sceneTitle">雨夜城际站</h2>
          </div>
          <p id="sceneMood">悬疑 / 初遇</p>
        </header>

        <section id="messageList" class="message-list" aria-live="polite"></section>

        <section id="inventoryPanel" class="inventory-panel" hidden>
          <div class="status-card" aria-label="玩家状态">
            <div class="panel-title">
              <span>状态</span>
              <strong id="statusName">林遥</strong>
            </div>
            <dl class="status-list">
              <div>
                <dt>身份</dt>
                <dd id="statusRole">替身契约者</dd>
              </div>
              <div>
                <dt>体力</dt>
                <dd><span id="statusHp">72</span>/100</dd>
              </div>
              <div>
                <dt>信任</dt>
                <dd><span id="statusTrust">18</span>/100</dd>
              </div>
              <div>
                <dt>线索</dt>
                <dd id="statusClue">黑伞</dd>
              </div>
            </dl>
          </div>
          <div class="equipment-card-list">
            <div class="panel-title">
              <span>装备</span>
              <strong>勾选后随行动携带</strong>
            </div>
            <div id="equipmentList" class="equipment-list"></div>
          </div>
        </section>

        <form id="playForm" class="composer">
          <button id="toggleInventoryButton" class="soft-button" type="button" aria-expanded="false">背包</button>
          <input id="playerInput" type="text" placeholder="输入你的行动或台词" />
          <button type="submit">发送</button>
          <button id="nextLineButton" type="button">继续</button>
        </form>

        <div class="quick-row" aria-label="快捷行动">
          <button type="button" data-choice="我按原剧情继续观察。">按剧情走</button>
          <button type="button" data-choice="我先问清楚他是谁。">追问</button>
          <button type="button" data-choice="我记下关键线索，准备偏离原剧情。">偏移</button>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./app.js?v=9"></script>
  </body>
</html>
