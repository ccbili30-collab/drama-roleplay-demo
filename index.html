<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>短剧 AI Galgame MVP</title>
    <link rel="stylesheet" href="./styles.css?v=23" />
  </head>
  <body>
    <main class="app-shell">
      <section id="videoPanel" class="video-panel">
        <div id="storyPlayer" class="story-player" aria-label="短剧播放器，播完后上滑进入互动剧情">
          <video id="dramaVideo" class="drama-video" src="./assets/drama-demo-web.mp4" playsinline controls preload="metadata"></video>
          <button id="swipeGate" class="swipe-gate" type="button" hidden>
            <span>上滑入戏</span>
          </button>
        </div>
      </section>

      <section id="loadingPanel" class="loading-panel" hidden>
        <div class="loader"></div>
        <p id="loadingText">正在接入剧情...</p>
      </section>

      <section id="gamePanel" class="galgame-panel" hidden>
        <div class="top-hud">
          <div>
            <span id="nodeIndex">Chapter 1</span>
            <strong id="sceneTitle">宴席逼问</strong>
          </div>
          <button id="bgmToggle" class="bgm-toggle" type="button" aria-pressed="false">悬疑BGM</button>
          <div class="stat-pills" aria-label="角色状态">
            <span id="statPrestige">威望 12</span>
            <span id="statClue">线索 20</span>
            <span id="statAlert">危险 10</span>
          </div>
        </div>

        <article id="novelPage" class="novel-page" hidden></article>

        <div id="toolRow" class="tool-row" aria-label="随身道具"></div>

        <section class="dialogue-area" aria-live="polite">
          <div class="speaker-tag" id="speakerName">大伯</div>
          <p id="storyText">你怎么在这片海上活下去？</p>
          <p id="resultNote" class="result-note" hidden></p>
        </section>

        <form id="customForm" class="custom-form" hidden>
          <input id="customInput" type="text" placeholder="写下你的自由行动" />
          <button type="submit">执行</button>
        </form>

        <div id="choiceGrid" class="choice-grid" aria-label="剧情选项"></div>

        <div id="advanceBar" class="advance-bar" hidden>
          <span></span>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./app.js?v=23"></script>
  </body>
</html>
